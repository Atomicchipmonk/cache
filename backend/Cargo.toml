[package]
name = "cache"
version = "0.1.0"
edition = "2021"

[dependencies]
# Database
rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Geospatial
geo = "0.28"
geozero = "0.12"
wkt = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Random data generation
fake = { version = "2.9", features = ["chrono", "geo"] }
rand = "0.8"

# CLI
clap = { version = "4.4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "cache-server"
path = "src/bin/server.rs"

[[bin]]
name = "cache-cli"
path = "src/bin/cli.rs"
